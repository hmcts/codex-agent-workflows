      EXPECTED_BASE_REF: ${{ needs.codex-review-generate-action.outputs.base_ref }}
      EXPECTED_HEAD_SHA: ${{ needs.codex-review-generate-action.outputs.head_sha }}
      EXPECTED_BASE_SHA: ${{ needs.codex-review-generate-action.outputs.base_sha }}
      LOCAL_PIPELINE_MODE: fast

    steps:
      - name: Locate trusted Codex runtime
        uses: hmcts/codex-agent-workflows/.github/actions/runtime@c9d374f423bea72f223b157fd54a96e5d53b207c

      - name: Download credential-free review source
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare-review-verification-source.outputs.artifact }}
          path: ${{ runner.temp }}/codex-review-verification-source

      - name: Restore credential-free review source
        run: tar -xzf "$RUNNER_TEMP/codex-review-verification-source/codex-review-source.tar.gz" -C "$GITHUB_WORKSPACE"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Download Codex review output
        uses: actions/download-artifact@v8
        with:
          name: codex-review-output
          path: ${{ runner.temp }}/codex-output

      - name: Verify Codex review patch
        id: verify
        env:
          OUTPUT_DIR: ${{ runner.temp }}/codex-output
          TRUSTED_PIPELINE_PATH: ${{ runner.temp }}/codex-review-verification-source/trusted-codex-local-pipeline.sh
        run: |
          set +e
          bash "$RUNNER_TEMP/codex-review-verification-source/trusted-codex-pr-review-verify.sh" >"$RUNNER_TEMP/codex-review-verification.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/codex-review-verification.log"
          if [[ "${status}" -eq 0 ]]; then
            echo "passed=true" >>"$GITHUB_OUTPUT"
          else
            mkdir -p "$RUNNER_TEMP/codex-review-verification-failure"
            cp "$RUNNER_TEMP/codex-review-verification.log" "$RUNNER_TEMP/codex-review-verification-failure/verification-failure.log"
            tail -n 240 "$RUNNER_TEMP/codex-review-verification.log" >"$RUNNER_TEMP/codex-review-verification-failure/verification-failure-summary.log"
            echo "passed=false" >>"$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload verified Codex review output
        if: steps.verify.outputs.passed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codex-review-verified
          path: |
            ${{ runner.temp }}/codex-output/codex-review-comment.md
            ${{ runner.temp }}/codex-output/guardrail-changes.txt
            ${{ runner.temp }}/codex-output/verification.env
          if-no-files-found: error
          retention-days: 1

      - name: Upload review verification failure
        if: steps.verify.outputs.passed == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: codex-review-verification-failure
          path: ${{ runner.temp }}/codex-review-verification-failure
          if-no-files-found: error
          retention-days: 1

  codex-review-prepublication-verification-failed:
