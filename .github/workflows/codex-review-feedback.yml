      - name: Return pull request to draft and notify Jira
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FAILURE_DIR: ${{ runner.temp }}/codex-review-terminal-failure
          NOTIFY_JIRA: "true"
        run: ${CODEX_RUNTIME_PATH}/.github/scripts/codex-mark-pr-failed.sh

      - name: Fail after pre-publication verification failure
        run: |
          echo "Review-feedback verification failed before publication; the pull request was returned to draft."
          exit 1
