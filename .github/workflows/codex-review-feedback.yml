name: Codex PR Review Feedback

on:
  workflow_call:
    inputs:
      model_environment:
        description: Caller environment gating model credentials; empty to skip
        required: false
        default: ''
        type: string
      publisher_environment:
        description: Caller environment gating publishing credentials; empty to skip
        required: false
        default: ''
        type: string

      runner_group:
        description: Organisation runner group containing the scale set
        required: true
        type: string
      runner_label:
        description: Repository-scoped ARC runner scale-set label
        required: true
        type: string
      formatter:
        description: "Formatter run on the files Codex changed before verification: none, or prettier (run through the Yarn release pinned in .yarnrc.yml). The formatted patch is the one published."
        required: false
        default: none
        type: string
      node_version_file:
        description: Repository file pinning the Node.js version for verification, such as .nvmrc; replaces node_version when set
        required: false
        default: ''
        type: string
      frontend_fast_command:
        description: FRONTEND_FAST_COMMAND for the local pipeline's fast checks, such as yarn lint; empty keeps the pipeline default
        required: false
        default: ''
        type: string
      node_version:
        description: Node.js version provisioned for credential-free verification
        required: false
        default: "22"
        type: string
      java_version:
        description: Java version provisioned for credential-free verification
        required: false
        default: "21"
        type: string
      github_app_client_id:
        description: Client ID of the HMCTS-owned Codex GitHub App
        required: true
        type: string
      required_status_context:
        description: Required post-PR status context
        required: false
        default: continuous-integration/jenkins/pr-head
        type: string
      required_status_poll_seconds:
        description: Required status polling interval
        required: false
        default: "30"
        type: string
      required_status_timeout_seconds:
        description: Required status timeout
        required: false
        default: "2700"
        type: string
      jira_notify_timeout_seconds:
        description: Jira callback timeout
        required: false
        default: "10"
        type: string
      publish_policy:
        description: "draft-on-failure publishes unverified work as a draft PR and reports every outcome to Jira; verified-only publishes only verified work and reports only pr-created"
        required: false
        default: draft-on-failure
        type: string
      cannot_be_built:
        description: "What to do when the required status reports that the commit cannot be built: stop, or repair (spend the post-PR repair on it)"
        required: false
        default: stop
        type: string
    secrets:
      CODEX_OPENAI_API_KEY:
        description: Pass it from the caller, or leave it empty when the caller's model environment holds it. The job that uses it fails if it is empty.
        required: false
      CODEX_GITHUB_APP_PRIVATE_KEY:
        description: Pass it from the caller, or leave it empty when the caller's publisher environment holds it. The job that uses it fails if it is empty.
        required: false
      CODEX_JIRA_PR_NOTIFY_URL:
        description: Pass it from the caller, or leave it empty when the caller's publisher environment holds it. The job that uses it fails if it is empty.
        required: false

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  validate-runner-target:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout shared workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Refuse an unknown formatter
        env:
          FORMATTER: ${{ inputs.formatter }}
        run: |
          case "${FORMATTER}" in
            none|prettier) ;;
            *) echo "::error title=Unknown formatter::formatter must be none or prettier, not '${FORMATTER}'."; exit 1 ;;
          esac
      - name: Refuse an unexpected runner group or label
        env:
          RUNNER_GROUP: ${{ inputs.runner_group }}
          RUNNER_LABEL: ${{ inputs.runner_label }}
        run: python3 -I .github/scripts/validate-runner-target.py
      - name: Refuse an unknown publication policy
        env:
          PUBLISH_POLICY: ${{ inputs.publish_policy }}
          CANNOT_BE_BUILT: ${{ inputs.cannot_be_built }}
        run: |
          case "${PUBLISH_POLICY}" in
            draft-on-failure|verified-only) ;;
            *) echo "::error title=Unknown publication policy::publish_policy must be draft-on-failure or verified-only, not '${PUBLISH_POLICY}'."; exit 1 ;;
          esac
          case "${CANNOT_BE_BUILT}" in
            stop|repair) ;;
            *) echo "::error title=Unknown cannot-be-built policy::cannot_be_built must be stop or repair, not '${CANNOT_BE_BUILT}'."; exit 1 ;;
          esac

  intake:
    needs: validate-runner-target
    permissions:
      contents: read
      pull-requests: read
      issues: read
    uses: ./.github/workflows/codex-review-intake.yml

  generate-and-verify:
    needs: intake
    if: needs.intake.outputs.is_codex_pr == 'true'
    permissions:
      contents: read
      pull-requests: read
      issues: read
    uses: ./.github/workflows/codex-review-generate.yml
    with:
      model_environment: ${{ inputs.model_environment }}
      publisher_environment: ${{ inputs.publisher_environment }}
      runner_group: ${{ inputs.runner_group }}
      runner_label: ${{ inputs.runner_label }}
      node_version: ${{ inputs.node_version }}
      formatter: ${{ inputs.formatter }}
      node_version_file: ${{ inputs.node_version_file }}
      frontend_fast_command: ${{ inputs.frontend_fast_command }}
      java_version: ${{ inputs.java_version }}
      is_codex_pr: ${{ needs.intake.outputs.is_codex_pr }}
      pr_number: ${{ needs.intake.outputs.pr_number }}
      head_ref: ${{ needs.intake.outputs.head_ref }}
    secrets:
      CODEX_OPENAI_API_KEY: ${{ secrets.CODEX_OPENAI_API_KEY }}

  publish:
    needs: [intake, generate-and-verify]
    if: always() && needs.intake.outputs.is_codex_pr == 'true' && needs.generate-and-verify.outputs.passed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/codex-review-publish.yml
    with:
      model_environment: ${{ inputs.model_environment }}
      publisher_environment: ${{ inputs.publisher_environment }}
      github_app_client_id: ${{ inputs.github_app_client_id }}
      formatter: ${{ inputs.formatter }}
      required_status_context: ${{ inputs.required_status_context }}
      required_status_poll_seconds: ${{ inputs.required_status_poll_seconds }}
      required_status_timeout_seconds: ${{ inputs.required_status_timeout_seconds }}
      is_codex_pr: ${{ needs.intake.outputs.is_codex_pr }}
      pr_number: ${{ needs.generate-and-verify.outputs.pr_number }}
      head_ref: ${{ needs.generate-and-verify.outputs.head_ref }}
      head_sha: ${{ needs.generate-and-verify.outputs.head_sha }}
      base_sha: ${{ needs.generate-and-verify.outputs.base_sha }}
      trusted_sha: ${{ needs.generate-and-verify.outputs.trusted_sha }}
      verification_passed: ${{ needs.generate-and-verify.outputs.passed }}
    secrets:
      CODEX_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_GITHUB_APP_PRIVATE_KEY }}

  repair:
    needs: [generate-and-verify, publish]
    if: always() && needs.publish.outputs.commit_sha != '' && needs.publish.outputs.passed == 'false'
    permissions:
      contents: read
      pull-requests: read
      issues: read
    uses: ./.github/workflows/codex-review-repair.yml
    with:
      model_environment: ${{ inputs.model_environment }}
      publisher_environment: ${{ inputs.publisher_environment }}
      publish_policy: ${{ inputs.publish_policy }}
      cannot_be_built: ${{ inputs.cannot_be_built }}
      runner_group: ${{ inputs.runner_group }}
      runner_label: ${{ inputs.runner_label }}
      node_version: ${{ inputs.node_version }}
      formatter: ${{ inputs.formatter }}
      node_version_file: ${{ inputs.node_version_file }}
      frontend_fast_command: ${{ inputs.frontend_fast_command }}
      java_version: ${{ inputs.java_version }}
      github_app_client_id: ${{ inputs.github_app_client_id }}
      required_status_context: ${{ inputs.required_status_context }}
      required_status_poll_seconds: ${{ inputs.required_status_poll_seconds }}
      required_status_timeout_seconds: ${{ inputs.required_status_timeout_seconds }}
      jira_notify_timeout_seconds: ${{ inputs.jira_notify_timeout_seconds }}
      pr_number: ${{ needs.generate-and-verify.outputs.pr_number }}
      head_ref: ${{ needs.generate-and-verify.outputs.head_ref }}
      base_ref: ${{ needs.generate-and-verify.outputs.base_ref }}
      head_sha: ${{ needs.generate-and-verify.outputs.head_sha }}
      base_sha: ${{ needs.generate-and-verify.outputs.base_sha }}
      trusted_sha: ${{ needs.generate-and-verify.outputs.trusted_sha }}
      published_commit_sha: ${{ needs.publish.outputs.commit_sha }}
      published_output_artifact: ${{ needs.publish.outputs.output_artifact }}
      initial_passed: ${{ needs.publish.outputs.passed }}
      initial_failure_class: ${{ needs.publish.outputs.failure_class }}
      initial_failure_artifact: ${{ needs.publish.outputs.failure_artifact }}
    secrets:
      CODEX_OPENAI_API_KEY: ${{ secrets.CODEX_OPENAI_API_KEY }}
      CODEX_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_GITHUB_APP_PRIVATE_KEY }}
      CODEX_JIRA_PR_NOTIFY_URL: ${{ secrets.CODEX_JIRA_PR_NOTIFY_URL }}

  terminal-failure:
    needs: [intake, generate-and-verify, publish]
    if: always() && needs.intake.outputs.is_codex_pr == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/codex-review-terminal.yml
    with:
      model_environment: ${{ inputs.model_environment }}
      publisher_environment: ${{ inputs.publisher_environment }}
      publish_policy: ${{ inputs.publish_policy }}
      github_app_client_id: ${{ inputs.github_app_client_id }}
      jira_notify_timeout_seconds: ${{ inputs.jira_notify_timeout_seconds }}
      is_codex_pr: ${{ needs.intake.outputs.is_codex_pr }}
      should_run: ${{ needs.generate-and-verify.outputs.should_run }}
      pr_number: ${{ needs.generate-and-verify.outputs.pr_number || needs.intake.outputs.pr_number }}
      head_sha: ${{ needs.generate-and-verify.outputs.head_sha }}
      verification_passed: ${{ needs.generate-and-verify.outputs.passed }}
      failure_artifact: ${{ needs.generate-and-verify.outputs.failure_artifact }}
      published_commit_sha: ${{ needs.publish.outputs.commit_sha }}
    secrets:
      CODEX_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_GITHUB_APP_PRIVATE_KEY }}
      CODEX_JIRA_PR_NOTIFY_URL: ${{ secrets.CODEX_JIRA_PR_NOTIFY_URL }}
