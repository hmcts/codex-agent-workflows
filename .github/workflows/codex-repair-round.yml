name: Codex repair and verification round

on:
  workflow_call:
    inputs:
      issueKey:
        required: true
        type: string
      summary:
        required: true
        type: string
      description:
        required: true
        type: string
      status:
        required: true
        type: string
      assignee:
        required: true
        type: string
      issueUrl:
        required: true
        type: string
      initiatorDisplayName:
        required: false
        default: ''
        type: string
      runner_label:
        required: true
        type: string
      node_version:
        required: false
        default: "22"
        type: string
      jira_notify_timeout_seconds:
        required: false
        default: "10"
        type: string
      attempt:
        required: true
        type: string
      max_attempts:
        required: false
        default: "3"
        type: string
      branch_name:
        required: true
        type: string
      trusted_sha:
        required: true
        type: string
      source_artifact:
        required: true
        type: string
      input_artifact:
        required: true
        type: string
      failure_artifact:
        required: true
        type: string
      plan_payload:
        required: true
        type: string
      plan_sha256:
        required: true
        type: string
    outputs:
      has_changes:
        value: ${{ jobs.collect-repair.outputs.has_changes }}
      passed:
        value: ${{ jobs.verify-repair.outputs.passed }}
      output_artifact:
        value: ${{ jobs.verify-repair.outputs.output_artifact }}
      verified_artifact:
        value: ${{ jobs.verify-repair.outputs.verified_artifact }}
      draft_artifact:
        value: ${{ jobs.verify-repair.outputs.draft_artifact }}
      failure_artifact:
        value: ${{ jobs.verify-repair.outputs.failure_artifact }}
    secrets:
      CODEX_OPENAI_API_KEY:
        required: true

jobs:
  repair-action:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      branch_name: ${{ steps.prepare.outputs.branch_name }}
      codex_result: ${{ steps.codex-action.outputs.final-message }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ISSUE_KEY: ${{ inputs.issueKey }}
      ISSUE_SUMMARY: ${{ inputs.summary }}
      ISSUE_DESCRIPTION: ${{ inputs.description }}
      ISSUE_STATUS: ${{ inputs.status }}
      ISSUE_ASSIGNEE: ${{ inputs.assignee }}
      ISSUE_URL: ${{ inputs.issueUrl }}
      REPAIR_ATTEMPT: ${{ inputs.attempt }}
      MAX_CODEX_REPAIR_ATTEMPTS: ${{ inputs.max_attempts }}
      CODEX_INPUT_ARTIFACT: ${{ inputs.input_artifact }}
      CODEX_FAILURE_ARTIFACT: ${{ inputs.failure_artifact }}
      CODEX_OUTPUT_ARTIFACT: codex-jira-output-repair-${{ inputs.attempt }}

    steps:
      - name: Locate trusted Codex runtime
        uses: $/.github/actions/runtime

      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.trusted_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify runner toolchain
        run: ${CODEX_RUNTIME_PATH}/.github/scripts/codex-runner-preflight.sh

      - name: Download Codex output to repair
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CODEX_INPUT_ARTIFACT }}
          path: ${{ runner.temp }}/codex-input

      - name: Download verification failure
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CODEX_FAILURE_ARTIFACT }}
          path: ${{ runner.temp }}/codex-failure

      - name: Materialise validated Codex plan
        env:
          CODEX_PLAN_PAYLOAD: ${{ inputs.plan_payload }}
          EXPECTED_PLAN_SHA: ${{ inputs.plan_sha256 }}
          OUTPUT_DIR: ${{ runner.temp }}/codex-plan
        run: ${CODEX_RUNTIME_PATH}/.github/scripts/validate-codex-plan.py --materialize

      - name: Prepare Codex repair prompt
        id: prepare
        env:
          INPUT_DIR: ${{ runner.temp }}/codex-input
          FAILURE_DIR: ${{ runner.temp }}/codex-failure
          PLAN_DIR: ${{ runner.temp }}/codex-plan
        run: ${CODEX_RUNTIME_PATH}/.github/scripts/codex-jira-repair.sh

      - name: Run Codex repair
        id: codex-action
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          allow-bot-users: hmcts-pr-publisher[bot]
          openai-api-key: ${{ secrets.CODEX_OPENAI_API_KEY }}
          responses-api-endpoint: https://eu.api.openai.com/v1/responses
          codex-version: '0.146.0'
          model: gpt-5.6-sol
          effort: medium
          prompt-file: ${{ steps.prepare.outputs.prompt_path }}
          output-schema-file: ${{ steps.prepare.outputs.schema_path }}
          working-directory: .
          permission-profile: ":workspace"
          safety-strategy: unprivileged-user
          codex-user: codex
          codex-args: '["--ephemeral"]'

  collect-repair:
    needs: repair-action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      branch_name: ${{ steps.repair.outputs.branch_name }}
      has_changes: ${{ steps.repair.outputs.has_changes }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ISSUE_KEY: ${{ inputs.issueKey }}
      ISSUE_SUMMARY: ${{ inputs.summary }}
      ISSUE_URL: ${{ inputs.issueUrl }}
      JIRA_INITIATOR_DISPLAY_NAME: ${{ inputs.initiatorDisplayName }}
      CODEX_INPUT_ARTIFACT: ${{ inputs.input_artifact }}
      CODEX_OUTPUT_ARTIFACT: codex-jira-output-repair-${{ inputs.attempt }}

    steps:
      - name: Locate trusted Codex runtime
        uses: $/.github/actions/runtime

      - name: Checkout trusted collector
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.trusted_sha }}
          persist-credentials: false

      - name: Download Codex output being repaired
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CODEX_INPUT_ARTIFACT }}
          path: ${{ runner.temp }}/codex-input

      - name: Materialise validated Codex plan
        env:
          CODEX_PLAN_PAYLOAD: ${{ inputs.plan_payload }}
          EXPECTED_PLAN_SHA: ${{ inputs.plan_sha256 }}
          OUTPUT_DIR: ${{ runner.temp }}/codex-plan
        run: ${CODEX_RUNTIME_PATH}/.github/scripts/validate-codex-plan.py --materialize

      - name: Materialise repaired Codex patch
        id: repair
        env:
          CODEX_RESULT: ${{ needs.repair-action.outputs.codex_result }}
          CODEX_OPERATION: jira-repair
          INPUT_DIR: ${{ runner.temp }}/codex-input
          OUTPUT_DIR: ${{ runner.temp }}/codex-output
          PLAN_DIR: ${{ runner.temp }}/codex-plan
          BRANCH_NAME: ${{ needs.repair-action.outputs.branch_name }}
          REPAIR_ATTEMPT: ${{ inputs.attempt }}
        run: ${CODEX_RUNTIME_PATH}/.github/scripts/codex-jira-collect.sh

      - name: Upload repaired Codex output
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CODEX_OUTPUT_ARTIFACT }}
          path: ${{ runner.temp }}/codex-output
          if-no-files-found: error
          retention-days: 1

  verify-repair:
    needs: collect-repair
    if: needs.collect-repair.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {}
    outputs:
      passed: ${{ steps.verify.outputs.passed || 'false' }}
      output_artifact: codex-jira-output-repair-${{ inputs.attempt }}
      verified_artifact: codex-jira-verified-${{ inputs.attempt }}
      draft_artifact: codex-jira-unverified-${{ inputs.attempt }}
      failure_artifact: codex-jira-verification-failure-${{ inputs.attempt }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EXPECTED_BRANCH_NAME: ${{ inputs.branch_name }}
      LOCAL_PIPELINE_MODE: fast
      CODEX_OUTPUT_ARTIFACT: codex-jira-output-repair-${{ inputs.attempt }}
      CODEX_VERIFIED_ARTIFACT: codex-jira-verified-${{ inputs.attempt }}
      CODEX_DRAFT_ARTIFACT: codex-jira-unverified-${{ inputs.attempt }}
      CODEX_FAILURE_ARTIFACT: codex-jira-verification-failure-${{ inputs.attempt }}

    steps:
      - name: Locate trusted Codex runtime
        uses: $/.github/actions/runtime

      - name: Download credential-free verification source
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.source_artifact }}
          path: ${{ runner.temp }}/codex-verification-source

      - name: Restore credential-free verification source
        run: tar -xzf "$RUNNER_TEMP/codex-verification-source/codex-verification-source.tar.gz" -C "$GITHUB_WORKSPACE"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Download Codex output
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CODEX_OUTPUT_ARTIFACT }}
          path: ${{ runner.temp }}/codex-output

      - name: Verify Codex patch
        id: verify
        env:
          OUTPUT_DIR: ${{ runner.temp }}/codex-output
        run: |
          set +e
          ${CODEX_RUNTIME_PATH}/.github/scripts/codex-jira-verify.sh >"$RUNNER_TEMP/codex-verification.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/codex-verification.log"
          if [[ "${status}" -eq 0 ]]; then
            echo "passed=true" >>"$GITHUB_OUTPUT"
          else
            mkdir -p "$RUNNER_TEMP/codex-verification-failure"
            cp "$RUNNER_TEMP/codex-verification.log" "$RUNNER_TEMP/codex-verification-failure/verification-failure.log"
            tail -n 240 "$RUNNER_TEMP/codex-verification.log" >"$RUNNER_TEMP/codex-verification-failure/verification-failure-summary.log"
            echo "passed=false" >>"$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload verified Codex output
        if: steps.verify.outputs.passed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CODEX_VERIFIED_ARTIFACT }}
          path: |
            ${{ runner.temp }}/codex-output/codex-pr-body.md
            ${{ runner.temp }}/codex-output/guardrail-changes.txt
            ${{ runner.temp }}/codex-output/verification.env
          if-no-files-found: error
          retention-days: 1

      - name: Upload unverified Codex output for draft publication
        if: steps.verify.outputs.passed != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CODEX_DRAFT_ARTIFACT }}
          path: |
            ${{ runner.temp }}/codex-output/codex-pr-body.md
            ${{ runner.temp }}/codex-output/guardrail-changes.txt
            ${{ runner.temp }}/codex-output/verification.env
          if-no-files-found: error
          retention-days: 1

      - name: Upload verification failure
        if: steps.verify.outputs.passed != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CODEX_FAILURE_ARTIFACT }}
          path: ${{ runner.temp }}/codex-verification-failure
          if-no-files-found: error
          retention-days: 1
