name: Codex review terminal failure

on:
  workflow_call:
    inputs:
      github_app_client_id:
        required: true
        type: string
      jira_notify_timeout_seconds:
        required: true
        type: string
      is_codex_pr:
        required: true
        type: string
      should_run:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      verification_passed:
        required: true
        type: string
      failure_artifact:
        required: true
        type: string
      published_commit_sha:
        required: true
        type: string
    secrets:
      CODEX_GITHUB_APP_PRIVATE_KEY:
        required: true
      CODEX_JIRA_PR_NOTIFY_URL:
        required: true

permissions:
  contents: read

jobs:
  codex-review-prepublication-verification-failed:
    if: |
      always() &&
      inputs.is_codex_pr == 'true' &&
      inputs.should_run == 'true' &&
      inputs.verification_passed != 'true' &&
      inputs.published_commit_sha == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
      FAILURE_MESSAGE: Credential-free review-feedback verification failed before the generated patch could be published.
      CODEX_JIRA_PR_NOTIFY_URL: ${{ secrets.CODEX_JIRA_PR_NOTIFY_URL }}
      CODEX_JIRA_PR_NOTIFY_TIMEOUT_SECONDS: ${{ inputs.jira_notify_timeout_seconds }}

    steps:
      - name: Locate trusted Codex runtime
        uses: hmcts/codex-agent-workflows/.github/actions/runtime@251cd5e577c0cb9acb22b953264ab5514a350402

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ inputs.github_app_client_id }}
          private-key: ${{ secrets.CODEX_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Verify GitHub App publisher
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GITHUB_APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: python3 -I ${CODEX_RUNTIME_PATH}/.github/scripts/codex-verify-publisher.py

      - name: Download review verification failure
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.failure_artifact }}
          path: ${{ runner.temp }}/codex-review-terminal-failure

      - name: Return pull request to draft and notify Jira
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FAILURE_DIR: ${{ runner.temp }}/codex-review-terminal-failure
          NOTIFY_JIRA: "true"
        run: ${CODEX_RUNTIME_PATH}/.github/scripts/codex-mark-pr-failed.sh

      - name: Fail after pre-publication verification failure
        run: |
          echo "Review-feedback verification failed before publication; the pull request was returned to draft."
          exit 1
