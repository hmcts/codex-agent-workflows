      CODEX_INPUT_ARTIFACT: ${{ needs.verify-codex-output-2.outputs.output_artifact }}
      CODEX_OUTPUT_ARTIFACT: codex-jira-output-repair-3

    steps:
      - name: Locate trusted Codex runtime
        uses: hmcts/codex-agent-workflows/.github/actions/runtime@8066b0980d0f098ff82e4964334e77c4dd6685a5

      - name: Checkout trusted collector
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.codex-generate.outputs.trusted_sha }}
          persist-credentials: false

      - name: Download Codex output being repaired
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CODEX_INPUT_ARTIFACT }}
          path: ${{ runner.temp }}/codex-input

      - name: Materialise validated Codex plan
        env:
          CODEX_PLAN_PAYLOAD: ${{ needs.validate-codex-plan.outputs.plan_payload }}
          EXPECTED_PLAN_SHA: ${{ needs.validate-codex-plan.outputs.plan_sha256 }}
          OUTPUT_DIR: ${{ runner.temp }}/codex-plan
        run: ${CODEX_RUNTIME_PATH}/.github/scripts/validate-codex-plan.py --materialize

      - name: Materialise repaired Codex patch
        id: repair
        env:
          CODEX_RESULT: ${{ needs.repair-codex-output-3-action.outputs.codex_result }}
          CODEX_OPERATION: jira-repair
          INPUT_DIR: ${{ runner.temp }}/codex-input
          OUTPUT_DIR: ${{ runner.temp }}/codex-output
          PLAN_DIR: ${{ runner.temp }}/codex-plan
          BRANCH_NAME: ${{ needs.repair-codex-output-3-action.outputs.branch_name }}
          REPAIR_ATTEMPT: '3'
        run: ${CODEX_RUNTIME_PATH}/.github/scripts/codex-jira-collect.sh

      - name: Upload repaired Codex output
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CODEX_OUTPUT_ARTIFACT }}
          path: ${{ runner.temp }}/codex-output
          if-no-files-found: error
          retention-days: 1

  verify-codex-output-3:
    needs: [codex-generate, repair-codex-output-3, prepare-codex-verification-source, validate-codex-plan]
    if: needs.repair-codex-output-3.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {}
    outputs:
      passed: ${{ steps.verify.outputs.passed || 'false' }}
      output_artifact: codex-jira-output-repair-3
      verified_artifact: codex-jira-verified-3
      draft_artifact: codex-jira-unverified-3
      failure_artifact: codex-jira-verification-failure-3
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EXPECTED_BRANCH_NAME: ${{ needs.codex-generate.outputs.branch_name }}
      LOCAL_PIPELINE_MODE: fast
      CODEX_OUTPUT_ARTIFACT: codex-jira-output-repair-3
      CODEX_VERIFIED_ARTIFACT: codex-jira-verified-3
      CODEX_DRAFT_ARTIFACT: codex-jira-unverified-3
      CODEX_FAILURE_ARTIFACT: codex-jira-verification-failure-3

    steps:
      - name: Locate trusted Codex runtime
        uses: hmcts/codex-agent-workflows/.github/actions/runtime@8066b0980d0f098ff82e4964334e77c4dd6685a5

      - name: Download credential-free verification source
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare-codex-verification-source.outputs.artifact }}
          path: ${{ runner.temp }}/codex-verification-source

      - name: Restore credential-free verification source
        run: tar -xzf "$RUNNER_TEMP/codex-verification-source/codex-verification-source.tar.gz" -C "$GITHUB_WORKSPACE"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Download Codex output
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CODEX_OUTPUT_ARTIFACT }}
          path: ${{ runner.temp }}/codex-output

      - name: Verify Codex patch
        id: verify
        env:
          OUTPUT_DIR: ${{ runner.temp }}/codex-output
        run: |
          set +e
          ${CODEX_RUNTIME_PATH}/.github/scripts/codex-jira-verify.sh >"$RUNNER_TEMP/codex-verification.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/codex-verification.log"
          if [[ "${status}" -eq 0 ]]; then
            echo "passed=true" >>"$GITHUB_OUTPUT"
          else
            mkdir -p "$RUNNER_TEMP/codex-verification-failure"
            cp "$RUNNER_TEMP/codex-verification.log" "$RUNNER_TEMP/codex-verification-failure/verification-failure.log"
            tail -n 240 "$RUNNER_TEMP/codex-verification.log" >"$RUNNER_TEMP/codex-verification-failure/verification-failure-summary.log"
            echo "passed=false" >>"$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload verified Codex output
        if: steps.verify.outputs.passed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CODEX_VERIFIED_ARTIFACT }}
          path: |
            ${{ runner.temp }}/codex-output/codex-pr-body.md
            ${{ runner.temp }}/codex-output/guardrail-changes.txt
            ${{ runner.temp }}/codex-output/verification.env
          if-no-files-found: error
          retention-days: 1

      - name: Upload unverified Codex output for draft publication
        if: steps.verify.outputs.passed != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CODEX_DRAFT_ARTIFACT }}
          path: |
            ${{ runner.temp }}/codex-output/codex-pr-body.md
            ${{ runner.temp }}/codex-output/guardrail-changes.txt
            ${{ runner.temp }}/codex-output/verification.env
          if-no-files-found: error
          retention-days: 1

      - name: Upload verification failure
        if: steps.verify.outputs.passed != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CODEX_FAILURE_ARTIFACT }}
          path: ${{ runner.temp }}/codex-verification-failure
          if-no-files-found: error
          retention-days: 1

  prepare-draft-publication:
    needs:
      - codex-generate
      - repair-codex-output-1
      - repair-codex-output-2
      - repair-codex-output-3
      - prepare-codex-verification-source
      - verify-codex-output
      - verify-codex-output-1
      - verify-codex-output-2
      - verify-codex-output-3
    if: |
      always() &&
      needs.codex-generate.outputs.has_changes == 'true' &&
      needs.verify-codex-output.outputs.passed != 'true' &&
      needs.verify-codex-output-1.outputs.passed != 'true' &&
      needs.verify-codex-output-2.outputs.passed != 'true' &&
      needs.verify-codex-output-3.outputs.passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    outputs:
      available: ${{ steps.outcome.outputs.available }}
      output_artifact: ${{ steps.outcome.outputs.output_artifact }}
      draft_artifact: codex-jira-terminal-draft
      failure_artifact: codex-jira-terminal-verification-failure
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EXPECTED_BRANCH_NAME: ${{ needs.codex-generate.outputs.branch_name }}
      CODEX_OUTPUT_ARTIFACT: ${{ needs.repair-codex-output-3.outputs.has_changes == 'true' && 'codex-jira-output-repair-3' || needs.repair-codex-output-2.outputs.has_changes == 'true' && 'codex-jira-output-repair-2' || needs.repair-codex-output-1.outputs.has_changes == 'true' && 'codex-jira-output-repair-1' || 'codex-jira-output' }}

    steps:
      - name: Locate trusted Codex runtime
        uses: hmcts/codex-agent-workflows/.github/actions/runtime@8066b0980d0f098ff82e4964334e77c4dd6685a5

      - name: Download credential-free verification source
        id: source
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: codex-verification-source
          path: ${{ runner.temp }}/codex-verification-source

      - name: Restore credential-free verification source
        id: restore
        if: steps.source.outcome == 'success'
        run: tar -xzf "$RUNNER_TEMP/codex-verification-source/codex-verification-source.tar.gz" -C "$GITHUB_WORKSPACE"

      - name: Download latest collected Codex output
        id: output
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CODEX_OUTPUT_ARTIFACT }}
          path: ${{ runner.temp }}/codex-output

      - name: Validate latest patch structure without repository execution
        id: structure
        if: steps.output.outcome == 'success'
        env:
          OUTPUT_DIR: ${{ runner.temp }}/codex-output
          SKIP_LOCAL_PIPELINE: "true"
        run: ${CODEX_RUNTIME_PATH}/.github/scripts/codex-jira-verify.sh

      - name: Upload structurally valid output for draft publication
        id: draft
        if: steps.structure.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: codex-jira-terminal-draft
          path: |
            ${{ runner.temp }}/codex-output/codex-pr-body.md
            ${{ runner.temp }}/codex-output/guardrail-changes.txt
            ${{ runner.temp }}/codex-output/verification.env
          if-no-files-found: error
          retention-days: 1

      - name: Record terminal recovery outcome
        id: outcome
        if: always()
        env:
          DRAFT_OUTCOME: ${{ steps.draft.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          OUTPUT_OUTCOME: ${{ steps.output.outcome }}
          STRUCTURE_OUTCOME: ${{ steps.structure.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/codex-terminal-verification-failure"
          {
            echo "Credential-free verification did not complete successfully after the available repair attempts."
            echo "Source artifact: ${SOURCE_OUTCOME}"
            echo "Source restore: ${RESTORE_OUTCOME}"
            echo "Patch artifact: ${OUTPUT_OUTCOME}"
            echo "Structural validation: ${STRUCTURE_OUTCOME}"
          } >"$RUNNER_TEMP/codex-terminal-verification-failure/verification-failure-summary.log"
          cp "$RUNNER_TEMP/codex-terminal-verification-failure/verification-failure-summary.log" \
            "$RUNNER_TEMP/codex-terminal-verification-failure/verification-failure.log"
          echo "output_artifact=${CODEX_OUTPUT_ARTIFACT}" >>"$GITHUB_OUTPUT"
          if [[ "${DRAFT_OUTCOME}" == "success" ]]; then
            echo "available=true" >>"$GITHUB_OUTPUT"
          else
            echo "available=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Upload terminal verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codex-jira-terminal-verification-failure
          path: ${{ runner.temp }}/codex-terminal-verification-failure
          if-no-files-found: error
          retention-days: 1

  publish-draft-pr:
    needs:
      - codex-generate
      - prepare-codex-verification-source
      - prepare-draft-publication
    if: always() && needs.prepare-draft-publication.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      branch_name: ${{ steps.state.outputs.branch_name || steps.publish.outputs.branch_name }}
      commit_sha: ${{ steps.state.outputs.commit_sha || steps.publish.outputs.commit_sha }}
      pr_url: ${{ steps.state.outputs.pr_url || steps.publish.outputs.pr_url }}
      pr_number: ${{ steps.state.outputs.pr_number || steps.publish.outputs.pr_number }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ISSUE_KEY: ${{ inputs.issueKey }}
      ISSUE_SUMMARY: ${{ inputs.summary }}
      ISSUE_URL: ${{ inputs.issueUrl }}
      EXPECTED_BRANCH_NAME: ${{ needs.codex-generate.outputs.branch_name }}
      EXPECTED_BASE_SHA: ${{ needs.prepare-codex-verification-source.outputs.source_sha }}
      JIRA_PUBLISH_MODE: initial
      PR_DRAFT: "true"
      CODEX_OUTPUT_ARTIFACT: ${{ needs.prepare-draft-publication.outputs.output_artifact }}
      CODEX_DRAFT_ARTIFACT: ${{ needs.prepare-draft-publication.outputs.draft_artifact }}
      CODEX_FAILURE_ARTIFACT: ${{ needs.prepare-draft-publication.outputs.failure_artifact }}
      CODEX_JIRA_PR_NOTIFY_URL: ${{ secrets.CODEX_JIRA_PR_NOTIFY_URL }}
      CODEX_JIRA_PR_NOTIFY_TIMEOUT_SECONDS: ${{ inputs.jira_notify_timeout_seconds }}

    steps:
      - name: Locate trusted Codex runtime
        uses: hmcts/codex-agent-workflows/.github/actions/runtime@8066b0980d0f098ff82e4964334e77c4dd6685a5

      - name: Checkout trusted publisher
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.codex-generate.outputs.trusted_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce pull-request credential isolation
        run: python3 -I ${CODEX_RUNTIME_PATH}/.github/scripts/check-codex-pr-safety.py --repository-root "$GITHUB_WORKSPACE"

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ inputs.github_app_client_id }}
          private-key: ${{ secrets.CODEX_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Verify GitHub App publisher
        id: publisher
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GITHUB_APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: python3 -I ${CODEX_RUNTIME_PATH}/.github/scripts/codex-verify-publisher.py

      - name: Download latest Codex output
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CODEX_OUTPUT_ARTIFACT }}
          path: ${{ runner.temp }}/codex-output

      - name: Download unverified publication metadata
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CODEX_DRAFT_ARTIFACT }}
          path: ${{ runner.temp }}/codex-unverified

      - name: Download verification failure
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CODEX_FAILURE_ARTIFACT }}
          path: ${{ runner.temp }}/codex-failure

      - name: Add failed verification evidence to draft PR body
        run: |
          {
            echo
            echo "### Automated verification"
            echo
            echo "**Status: failed after the available automated repair attempts.**"
            echo
            echo "This pull request is a draft. The implementation is preserved for review, but it must not be treated as verified."
            echo
            echo '<details><summary>Latest verification failure</summary>'
            echo
            echo '```text'
            sed -n '1,240p' "$RUNNER_TEMP/codex-failure/verification-failure-summary.log"
            echo '```'
            echo '</details>'
          } >>"$RUNNER_TEMP/codex-unverified/codex-pr-body.md"

      - name: Copy trusted publish script
        run: |
          cp ${CODEX_RUNTIME_PATH}/.github/scripts/codex-jira-publish.sh "$RUNNER_TEMP/codex-jira-publish.sh"
          chmod +x "$RUNNER_TEMP/codex-jira-publish.sh"

      - name: Publish draft pull request and notify Jira
        id: publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_PUBLISHER_LOGIN: ${{ steps.publisher.outputs.publisher_login }}
          BOT_PUBLISHER_EMAIL: ${{ steps.publisher.outputs.publisher_email }}
          OUTPUT_DIR: ${{ runner.temp }}/codex-output
          VERIFICATION_DIR: ${{ runner.temp }}/codex-unverified
        run: "$RUNNER_TEMP/codex-jira-publish.sh"

      - name: Recover draft pull request state
        id: state
        if: always() && steps.publish.outputs.commit_sha != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH_NAME: ${{ steps.publish.outputs.branch_name }}
          COMMIT_SHA: ${{ steps.publish.outputs.commit_sha }}
        run: |
          pr_json="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "${BRANCH_NAME}" --state open --json number,url,headRefOid --jq '.[0]')"
          test "$(jq -r '.headRefOid // empty' <<<"${pr_json}")" = "${COMMIT_SHA}"
          echo "branch_name=${BRANCH_NAME}" >>"$GITHUB_OUTPUT"
          echo "commit_sha=${COMMIT_SHA}" >>"$GITHUB_OUTPUT"
          echo "pr_url=$(jq -r .url <<<"${pr_json}")" >>"$GITHUB_OUTPUT"
          echo "pr_number=$(jq -r .number <<<"${pr_json}")" >>"$GITHUB_OUTPUT"

      - name: Retry Jira callback after partial draft publication
        if: always() && steps.publish.outcome == 'failure' && steps.state.outcome == 'success'
        continue-on-error: true
        env:
          BRANCH_NAME: ${{ steps.state.outputs.branch_name }}
          COMMIT_SHA: ${{ steps.state.outputs.commit_sha }}
          PR_URL: ${{ steps.state.outputs.pr_url }}
        run: |
          python3 -I ${CODEX_RUNTIME_PATH}/.github/scripts/notify-jira-automation.py \
            --pr-url "${PR_URL}" \
            --branch-name "${BRANCH_NAME}" \
            --commit-sha "${COMMIT_SHA}" \
            --draft true \
            --verification-status failed

  publish-pr:
