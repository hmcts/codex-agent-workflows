            --draft false \
            --verification-status passed

      - name: Write workflow summary
        if: always()
        run: |
          {
            echo "## Codex Jira Dispatch"
            echo
            echo "- Issue: [$ISSUE_KEY]($ISSUE_URL)"
            echo "- Branch: ${{ steps.publish.outputs.branch_name }}"
            echo "- Pull request: ${{ steps.publish.outputs.pr_url }}"
          } >>"$GITHUB_STEP_SUMMARY"

  verify-published-pr-patch:
    needs: [publish-pr, prepare-codex-verification-source, validate-codex-plan]
    if: always() && needs.publish-pr.outputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {}
    outputs:
      passed: ${{ steps.verify.outputs.passed || 'false' }}
      output_artifact: ${{ steps.selected-artifacts.outputs.output_artifact }}
      failure_artifact: ${{ steps.selected-artifacts.outputs.failure_artifact }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EXPECTED_BRANCH_NAME: ${{ needs.publish-pr.outputs.branch_name }}
      LOCAL_PIPELINE_MODE: fast
      CODEX_OUTPUT_ARTIFACT: ${{ needs.publish-pr.outputs.output_artifact }}
      CODEX_FAILURE_ARTIFACT: codex-jira-pr-verification-failure-0

    steps:
      - name: Locate trusted Codex runtime
        uses: hmcts/codex-agent-workflows/.github/actions/runtime@8066b0980d0f098ff82e4964334e77c4dd6685a5

      - name: Record selected Codex artifacts
        id: selected-artifacts
        run: |
          echo "output_artifact=${CODEX_OUTPUT_ARTIFACT}" >>"$GITHUB_OUTPUT"
          echo "failure_artifact=${CODEX_FAILURE_ARTIFACT}" >>"$GITHUB_OUTPUT"

      - name: Download credential-free verification source
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare-codex-verification-source.outputs.artifact }}
          path: ${{ runner.temp }}/codex-verification-source

      - name: Restore credential-free verification source
        run: tar -xzf "$RUNNER_TEMP/codex-verification-source/codex-verification-source.tar.gz" -C "$GITHUB_WORKSPACE"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Download Codex output
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CODEX_OUTPUT_ARTIFACT }}
          path: ${{ runner.temp }}/codex-output

      - name: Verify published PR patch without credentials
        id: verify
        env:
          OUTPUT_DIR: ${{ runner.temp }}/codex-output
        run: |
          set +e
          ${CODEX_RUNTIME_PATH}/.github/scripts/codex-jira-verify.sh >"$RUNNER_TEMP/codex-pr-verification.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/codex-pr-verification.log"
          if [[ "$status" -eq 0 ]]; then
            echo "passed=true" >>"$GITHUB_OUTPUT"
          else
            mkdir -p "$RUNNER_TEMP/codex-pr-verification-failure"
            cp "$RUNNER_TEMP/codex-pr-verification.log" "$RUNNER_TEMP/codex-pr-verification-failure/verification-failure.log"
            tail -n 240 "$RUNNER_TEMP/codex-pr-verification.log" >"$RUNNER_TEMP/codex-pr-verification-failure/verification-failure-summary.log"
            echo "passed=false" >>"$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload PR verification failure
        if: steps.verify.outputs.passed != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CODEX_FAILURE_ARTIFACT }}
          path: ${{ runner.temp }}/codex-pr-verification-failure
          if-no-files-found: error
          retention-days: 1

  verify-published-pr:
    needs: [codex-generate, publish-pr, verify-published-pr-patch]
    if: always() && needs.publish-pr.outputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      passed: ${{ steps.verify.outputs.passed || 'false' }}
      output_artifact: ${{ needs.verify-published-pr-patch.outputs.output_artifact }}
      failure_artifact: ${{ steps.verify.outputs.failure_artifact }}
    env:
      GH_TOKEN: ${{ github.token }}
      SONAR_TOKEN: ${{ secrets.CODEX_SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
      SONAR_PROJECT_KEY: ${{ inputs.sonar_project_key }}
      PR_NUMBER: ${{ needs.publish-pr.outputs.pr_number }}
      PUBLISHED_COMMIT_SHA: ${{ needs.publish-pr.outputs.commit_sha }}
      REQUIRED_STATUS_CONTEXT: ${{ inputs.required_status_context }}
      REQUIRED_STATUS_TIMEOUT_SECONDS: ${{ inputs.required_status_timeout_seconds }}
      REQUIRED_STATUS_POLL_SECONDS: ${{ inputs.required_status_poll_seconds }}
      STATUS_FAILURE_ARTIFACT: codex-jira-pr-status-failure-0
    steps:
      - name: Locate trusted Codex runtime
        uses: hmcts/codex-agent-workflows/.github/actions/runtime@8066b0980d0f098ff82e4964334e77c4dd6685a5

      - name: Checkout trusted status scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.codex-generate.outputs.trusted_sha }}
          persist-credentials: false
      - name: Check external PR status and Sonar quality gate
        id: verify
        env:
          LOCAL_VERIFICATION_PASSED: ${{ needs.verify-published-pr-patch.outputs.passed }}
          LOCAL_FAILURE_ARTIFACT: ${{ needs.verify-published-pr-patch.outputs.failure_artifact }}
        run: |
          if [[ "$LOCAL_VERIFICATION_PASSED" != "true" ]]; then
            echo "passed=false" >>"$GITHUB_OUTPUT"
            echo "failure_artifact=$LOCAL_FAILURE_ARTIFACT" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          {
            ${CODEX_RUNTIME_PATH}/.github/scripts/codex-wait-pr-status.sh
            status=$?
            if [[ "$status" -eq 0 ]]; then
              ${CODEX_RUNTIME_PATH}/.github/scripts/codex-check-sonar-quality-gate.sh
              status=$?
            fi
            exit "$status"
          } >"$RUNNER_TEMP/codex-pr-status.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/codex-pr-status.log"
          echo "failure_artifact=$STATUS_FAILURE_ARTIFACT" >>"$GITHUB_OUTPUT"
          if [[ "$status" -eq 0 ]]; then
            echo "passed=true" >>"$GITHUB_OUTPUT"
          else
            mkdir -p "$RUNNER_TEMP/codex-pr-status-failure"
            cp "$RUNNER_TEMP/codex-pr-status.log" "$RUNNER_TEMP/codex-pr-status-failure/verification-failure.log"
            tail -n 240 "$RUNNER_TEMP/codex-pr-status.log" >"$RUNNER_TEMP/codex-pr-status-failure/verification-failure-summary.log"
            echo "passed=false" >>"$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Upload external status failure
        if: >-
          steps.verify.outputs.passed != 'true' &&
          needs.verify-published-pr-patch.outputs.passed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.STATUS_FAILURE_ARTIFACT }}
          path: ${{ runner.temp }}/codex-pr-status-failure
          if-no-files-found: error
          retention-days: 1

  repair-published-pr-1-action:
    needs: [codex-generate, publish-pr, verify-published-pr, validate-codex-plan]
    if: always() && needs.verify-published-pr.outputs.passed == 'false'
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      branch_name: ${{ steps.prepare.outputs.branch_name }}
      codex_result: ${{ steps.codex-action.outputs.final-message }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ISSUE_KEY: ${{ inputs.issueKey }}
      ISSUE_SUMMARY: ${{ inputs.summary }}
      ISSUE_DESCRIPTION: ${{ inputs.description }}
      ISSUE_STATUS: ${{ inputs.status }}
      ISSUE_ASSIGNEE: ${{ inputs.assignee }}
      ISSUE_URL: ${{ inputs.issueUrl }}
      REPAIR_ATTEMPT: '1'
      MAX_CODEX_REPAIR_ATTEMPTS: '3'
      CODEX_INPUT_ARTIFACT: ${{ needs.verify-published-pr.outputs.output_artifact }}
      CODEX_FAILURE_ARTIFACT: ${{ needs.verify-published-pr.outputs.failure_artifact }}
      CODEX_OUTPUT_ARTIFACT: codex-jira-output-pr-repair-1

    steps:
      - name: Locate trusted Codex runtime
        uses: hmcts/codex-agent-workflows/.github/actions/runtime@8066b0980d0f098ff82e4964334e77c4dd6685a5

      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.codex-generate.outputs.trusted_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify runner toolchain
        run: ${CODEX_RUNTIME_PATH}/.github/scripts/codex-runner-preflight.sh

      - name: Download Codex output to repair
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CODEX_INPUT_ARTIFACT }}
          path: ${{ runner.temp }}/codex-input

      - name: Download PR verification failure
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CODEX_FAILURE_ARTIFACT }}
          path: ${{ runner.temp }}/codex-failure

      - name: Materialise validated Codex plan
        env:
          CODEX_PLAN_PAYLOAD: ${{ needs.validate-codex-plan.outputs.plan_payload }}
          EXPECTED_PLAN_SHA: ${{ needs.validate-codex-plan.outputs.plan_sha256 }}
          OUTPUT_DIR: ${{ runner.temp }}/codex-plan
        run: ${CODEX_RUNTIME_PATH}/.github/scripts/validate-codex-plan.py --materialize

      - name: Prepare Codex repair prompt from PR verification
        id: prepare
        env:
          INPUT_DIR: ${{ runner.temp }}/codex-input
          FAILURE_DIR: ${{ runner.temp }}/codex-failure
          PLAN_DIR: ${{ runner.temp }}/codex-plan
        run: ${CODEX_RUNTIME_PATH}/.github/scripts/codex-jira-repair.sh

      - name: Run Codex repair
        id: codex-action
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          allow-bot-users: hmcts-pr-publisher[bot]
          openai-api-key: ${{ secrets.CODEX_OPENAI_API_KEY }}
          responses-api-endpoint: https://eu.api.openai.com/v1/responses
          codex-version: '0.146.0'
          model: gpt-5.6-sol
          effort: medium
          prompt-file: ${{ steps.prepare.outputs.prompt_path }}
          output-schema-file: ${{ steps.prepare.outputs.schema_path }}
          working-directory: .
          permission-profile: ":workspace"
          safety-strategy: unprivileged-user
          codex-user: codex
          codex-args: '["--ephemeral"]'

  repair-published-pr-1:
    needs: [codex-generate, verify-published-pr, repair-published-pr-1-action, validate-codex-plan]
    if: always() && needs.verify-published-pr.outputs.passed == 'false' && needs.repair-published-pr-1-action.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      branch_name: ${{ steps.repair.outputs.branch_name }}
      has_changes: ${{ steps.repair.outputs.has_changes }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ISSUE_KEY: ${{ inputs.issueKey }}
      ISSUE_SUMMARY: ${{ inputs.summary }}
      ISSUE_URL: ${{ inputs.issueUrl }}
      JIRA_INITIATOR_DISPLAY_NAME: ${{ inputs.initiatorDisplayName }}
      CODEX_INPUT_ARTIFACT: ${{ needs.verify-published-pr.outputs.output_artifact }}
      CODEX_OUTPUT_ARTIFACT: codex-jira-output-pr-repair-1

    steps:
      - name: Locate trusted Codex runtime
        uses: hmcts/codex-agent-workflows/.github/actions/runtime@8066b0980d0f098ff82e4964334e77c4dd6685a5

      - name: Checkout trusted collector
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.codex-generate.outputs.trusted_sha }}
          persist-credentials: false

      - name: Download Codex output being repaired
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CODEX_INPUT_ARTIFACT }}
          path: ${{ runner.temp }}/codex-input

      - name: Materialise validated Codex plan
        env:
          CODEX_PLAN_PAYLOAD: ${{ needs.validate-codex-plan.outputs.plan_payload }}
          EXPECTED_PLAN_SHA: ${{ needs.validate-codex-plan.outputs.plan_sha256 }}
          OUTPUT_DIR: ${{ runner.temp }}/codex-plan
        run: ${CODEX_RUNTIME_PATH}/.github/scripts/validate-codex-plan.py --materialize

      - name: Materialise repaired Codex patch
        id: repair
        env:
          CODEX_RESULT: ${{ needs.repair-published-pr-1-action.outputs.codex_result }}
          CODEX_OPERATION: jira-repair
          INPUT_DIR: ${{ runner.temp }}/codex-input
          OUTPUT_DIR: ${{ runner.temp }}/codex-output
          PLAN_DIR: ${{ runner.temp }}/codex-plan
          BRANCH_NAME: ${{ needs.repair-published-pr-1-action.outputs.branch_name }}
          REPAIR_ATTEMPT: '1'
        run: ${CODEX_RUNTIME_PATH}/.github/scripts/codex-jira-collect.sh

      - name: Upload repaired Codex output
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CODEX_OUTPUT_ARTIFACT }}
          path: ${{ runner.temp }}/codex-output
          if-no-files-found: error
          retention-days: 1

  verify-published-pr-repair-1:
    needs: [codex-generate, repair-published-pr-1, prepare-codex-verification-source, validate-codex-plan]
    if: needs.repair-published-pr-1.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {}
    outputs:
      passed: ${{ steps.verify.outputs.passed || 'false' }}
      output_artifact: ${{ steps.selected-artifacts.outputs.output_artifact }}
      verified_artifact: ${{ steps.selected-artifacts.outputs.verified_artifact }}
      failure_artifact: ${{ steps.selected-artifacts.outputs.failure_artifact }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EXPECTED_BRANCH_NAME: ${{ needs.codex-generate.outputs.branch_name }}
      LOCAL_PIPELINE_MODE: fast
      CODEX_OUTPUT_ARTIFACT: codex-jira-output-pr-repair-1
      CODEX_VERIFIED_ARTIFACT: codex-jira-pr-repair-verified-1
      CODEX_FAILURE_ARTIFACT: codex-jira-pr-repair-verification-failure-1

    steps:
      - name: Locate trusted Codex runtime
        uses: hmcts/codex-agent-workflows/.github/actions/runtime@8066b0980d0f098ff82e4964334e77c4dd6685a5

      - name: Record selected Codex artifacts
        id: selected-artifacts
        run: |
          echo "output_artifact=${CODEX_OUTPUT_ARTIFACT}" >>"$GITHUB_OUTPUT"
          echo "verified_artifact=${CODEX_VERIFIED_ARTIFACT}" >>"$GITHUB_OUTPUT"
          echo "failure_artifact=${CODEX_FAILURE_ARTIFACT}" >>"$GITHUB_OUTPUT"

      - name: Download credential-free verification source
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare-codex-verification-source.outputs.artifact }}
          path: ${{ runner.temp }}/codex-verification-source

      - name: Restore credential-free verification source
        run: tar -xzf "$RUNNER_TEMP/codex-verification-source/codex-verification-source.tar.gz" -C "$GITHUB_WORKSPACE"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Download repaired Codex output
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CODEX_OUTPUT_ARTIFACT }}
          path: ${{ runner.temp }}/codex-output

      - name: Verify repaired Codex patch before re-publish
        id: verify
        env:
          OUTPUT_DIR: ${{ runner.temp }}/codex-output
        run: |
          set +e
          ${CODEX_RUNTIME_PATH}/.github/scripts/codex-jira-verify.sh >"$RUNNER_TEMP/codex-pr-repair-verification.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/codex-pr-repair-verification.log"
          if [[ "${status}" -eq 0 ]]; then
            echo "passed=true" >>"$GITHUB_OUTPUT"
          else
            mkdir -p "$RUNNER_TEMP/codex-pr-repair-verification-failure"
            cp "$RUNNER_TEMP/codex-pr-repair-verification.log" "$RUNNER_TEMP/codex-pr-repair-verification-failure/verification-failure.log"
            tail -n 240 "$RUNNER_TEMP/codex-pr-repair-verification.log" >"$RUNNER_TEMP/codex-pr-repair-verification-failure/verification-failure-summary.log"
            echo "passed=false" >>"$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload verified repaired Codex output
        if: steps.verify.outputs.passed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CODEX_VERIFIED_ARTIFACT }}
          path: |
            ${{ runner.temp }}/codex-output/codex-pr-body.md
            ${{ runner.temp }}/codex-output/guardrail-changes.txt
            ${{ runner.temp }}/codex-output/verification.env
          if-no-files-found: error
          retention-days: 1

      - name: Upload repaired verification failure
        if: steps.verify.outputs.passed != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CODEX_FAILURE_ARTIFACT }}
          path: ${{ runner.temp }}/codex-pr-repair-verification-failure
          if-no-files-found: error
          retention-days: 1

  publish-published-pr-repair-1:
    needs: [codex-generate, publish-pr, verify-published-pr-repair-1, prepare-codex-verification-source]
    if: always() && needs.verify-published-pr-repair-1.outputs.passed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      branch_name: ${{ steps.state.outputs.branch_name || steps.publish.outputs.branch_name }}
      commit_sha: ${{ steps.state.outputs.commit_sha || steps.publish.outputs.commit_sha }}
      pr_url: ${{ steps.state.outputs.pr_url || steps.publish.outputs.pr_url }}
      pr_number: ${{ steps.state.outputs.pr_number || steps.publish.outputs.pr_number }}
      output_artifact: ${{ steps.selected-artifacts.outputs.output_artifact }}
      verified_artifact: ${{ steps.selected-artifacts.outputs.verified_artifact }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ISSUE_KEY: ${{ inputs.issueKey }}
      ISSUE_SUMMARY: ${{ inputs.summary }}
      ISSUE_URL: ${{ inputs.issueUrl }}
      EXPECTED_BRANCH_NAME: ${{ needs.codex-generate.outputs.branch_name }}
      EXPECTED_BASE_SHA: ${{ needs.prepare-codex-verification-source.outputs.source_sha }}
      JIRA_PUBLISH_MODE: repair
      EXPECTED_BRANCH_HEAD_SHA: ${{ needs.publish-pr.outputs.commit_sha }}
      CODEX_OUTPUT_ARTIFACT: ${{ needs.verify-published-pr-repair-1.outputs.output_artifact }}
      CODEX_VERIFIED_ARTIFACT: ${{ needs.verify-published-pr-repair-1.outputs.verified_artifact }}
      CODEX_JIRA_PR_NOTIFY_URL: ${{ secrets.CODEX_JIRA_PR_NOTIFY_URL }}
      CODEX_JIRA_PR_NOTIFY_TIMEOUT_SECONDS: ${{ inputs.jira_notify_timeout_seconds }}

    steps:
      - name: Locate trusted Codex runtime
        uses: hmcts/codex-agent-workflows/.github/actions/runtime@8066b0980d0f098ff82e4964334e77c4dd6685a5

      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.codex-generate.outputs.trusted_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce pull-request credential isolation
        run: python3 -I ${CODEX_RUNTIME_PATH}/.github/scripts/check-codex-pr-safety.py --repository-root "$GITHUB_WORKSPACE"

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ inputs.github_app_client_id }}
          private-key: ${{ secrets.CODEX_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Verify GitHub App publisher
        id: publisher
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GITHUB_APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: python3 -I ${CODEX_RUNTIME_PATH}/.github/scripts/codex-verify-publisher.py

      - name: Record selected Codex artifacts
        id: selected-artifacts
        run: |
          echo "output_artifact=${CODEX_OUTPUT_ARTIFACT}" >>"$GITHUB_OUTPUT"
          echo "verified_artifact=${CODEX_VERIFIED_ARTIFACT}" >>"$GITHUB_OUTPUT"

      - name: Download repaired Codex output
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CODEX_OUTPUT_ARTIFACT }}
          path: ${{ runner.temp }}/codex-output

      - name: Download verified repaired Codex output
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CODEX_VERIFIED_ARTIFACT }}
          path: ${{ runner.temp }}/codex-verified

      - name: Copy trusted publish script
        run: |
          cp ${CODEX_RUNTIME_PATH}/.github/scripts/codex-jira-publish.sh "$RUNNER_TEMP/codex-jira-publish.sh"
          chmod +x "$RUNNER_TEMP/codex-jira-publish.sh"

      - name: Re-publish repaired pull request
        id: publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_PUBLISHER_LOGIN: ${{ steps.publisher.outputs.publisher_login }}
          BOT_PUBLISHER_EMAIL: ${{ steps.publisher.outputs.publisher_email }}
          OUTPUT_DIR: ${{ runner.temp }}/codex-output
          VERIFICATION_DIR: ${{ runner.temp }}/codex-verified
        run: "$RUNNER_TEMP/codex-jira-publish.sh"

      - name: Recover repaired pull request state
        id: state
        if: always() && steps.publish.outputs.commit_sha != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH_NAME: ${{ steps.publish.outputs.branch_name }}
          COMMIT_SHA: ${{ steps.publish.outputs.commit_sha }}
        run: |
          pr_json="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "${BRANCH_NAME}" --state open --json number,url,headRefOid --jq '.[0]')"
          test "$(jq -r '.headRefOid // empty' <<<"${pr_json}")" = "${COMMIT_SHA}"
          echo "branch_name=${BRANCH_NAME}" >>"$GITHUB_OUTPUT"
          echo "commit_sha=${COMMIT_SHA}" >>"$GITHUB_OUTPUT"
          echo "pr_url=$(jq -r .url <<<"${pr_json}")" >>"$GITHUB_OUTPUT"
          echo "pr_number=$(jq -r .number <<<"${pr_json}")" >>"$GITHUB_OUTPUT"

      - name: Retry Jira callback after partial repair publication
        if: always() && steps.publish.outcome == 'failure' && steps.state.outcome == 'success'
        continue-on-error: true
        env:
          BRANCH_NAME: ${{ steps.state.outputs.branch_name }}
          COMMIT_SHA: ${{ steps.state.outputs.commit_sha }}
          PR_URL: ${{ steps.state.outputs.pr_url }}
        run: |
          python3 -I ${CODEX_RUNTIME_PATH}/.github/scripts/notify-jira-automation.py \
            --pr-url "${PR_URL}" \
            --branch-name "${BRANCH_NAME}" \
            --commit-sha "${COMMIT_SHA}" \
            --draft false \
            --verification-status passed

  verify-published-pr-1-patch:
    needs: [publish-published-pr-repair-1, prepare-codex-verification-source, validate-codex-plan]
    if: always() && needs.publish-published-pr-repair-1.outputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {}
    outputs:
      passed: ${{ steps.verify.outputs.passed || 'false' }}
      failure_artifact: codex-jira-pr-repair-patch-failure-1
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EXPECTED_BRANCH_NAME: ${{ needs.publish-published-pr-repair-1.outputs.branch_name }}
      LOCAL_PIPELINE_MODE: fast
      CODEX_OUTPUT_ARTIFACT: ${{ needs.publish-published-pr-repair-1.outputs.output_artifact }}
      CODEX_FAILURE_ARTIFACT: codex-jira-pr-repair-patch-failure-1

    steps:
      - name: Locate trusted Codex runtime
        uses: hmcts/codex-agent-workflows/.github/actions/runtime@8066b0980d0f098ff82e4964334e77c4dd6685a5

      - name: Download credential-free verification source
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare-codex-verification-source.outputs.artifact }}
          path: ${{ runner.temp }}/codex-verification-source

      - name: Restore credential-free verification source
        run: tar -xzf "$RUNNER_TEMP/codex-verification-source/codex-verification-source.tar.gz" -C "$GITHUB_WORKSPACE"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Download repaired Codex output
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CODEX_OUTPUT_ARTIFACT }}
          path: ${{ runner.temp }}/codex-output

      - name: Verify repaired published PR patch without credentials
        id: verify
        env:
          OUTPUT_DIR: ${{ runner.temp }}/codex-output
        run: |
          set +e
          ${CODEX_RUNTIME_PATH}/.github/scripts/codex-jira-verify.sh >"$RUNNER_TEMP/codex-repaired-pr-verification.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/codex-repaired-pr-verification.log"
          if [[ "$status" -eq 0 ]]; then
            echo "passed=true" >>"$GITHUB_OUTPUT"
          else
            mkdir -p "$RUNNER_TEMP/codex-repaired-pr-verification-failure"
            cp "$RUNNER_TEMP/codex-repaired-pr-verification.log" "$RUNNER_TEMP/codex-repaired-pr-verification-failure/verification-failure.log"
            tail -n 240 "$RUNNER_TEMP/codex-repaired-pr-verification.log" >"$RUNNER_TEMP/codex-repaired-pr-verification-failure/verification-failure-summary.log"
            echo "passed=false" >>"$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload repaired PR patch verification failure
        if: steps.verify.outputs.passed != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CODEX_FAILURE_ARTIFACT }}
          path: ${{ runner.temp }}/codex-repaired-pr-verification-failure
          if-no-files-found: error
          retention-days: 1

  verify-published-pr-1:
    needs: [codex-generate, publish-published-pr-repair-1, verify-published-pr-1-patch]
    if: always() && needs.publish-published-pr-repair-1.outputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      passed: ${{ steps.verify.outputs.passed || 'false' }}
      failure_artifact: ${{ steps.verify.outputs.failure_artifact }}
    env:
      GH_TOKEN: ${{ github.token }}
      SONAR_TOKEN: ${{ secrets.CODEX_SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
      SONAR_PROJECT_KEY: ${{ inputs.sonar_project_key }}
      PR_NUMBER: ${{ needs.publish-published-pr-repair-1.outputs.pr_number }}
      PUBLISHED_COMMIT_SHA: ${{ needs.publish-published-pr-repair-1.outputs.commit_sha }}
      REQUIRED_STATUS_CONTEXT: ${{ inputs.required_status_context }}
      REQUIRED_STATUS_TIMEOUT_SECONDS: ${{ inputs.required_status_timeout_seconds }}
      REQUIRED_STATUS_POLL_SECONDS: ${{ inputs.required_status_poll_seconds }}
      STATUS_FAILURE_ARTIFACT: codex-jira-pr-status-failure-1
    steps:
      - name: Locate trusted Codex runtime
        uses: hmcts/codex-agent-workflows/.github/actions/runtime@8066b0980d0f098ff82e4964334e77c4dd6685a5

      - name: Checkout trusted status scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.codex-generate.outputs.trusted_sha }}
          persist-credentials: false
      - name: Check repaired external PR status and Sonar quality gate
        id: verify
        env:
          LOCAL_VERIFICATION_PASSED: ${{ needs.verify-published-pr-1-patch.outputs.passed }}
          LOCAL_FAILURE_ARTIFACT: ${{ needs.verify-published-pr-1-patch.outputs.failure_artifact }}
        run: |
          if [[ "$LOCAL_VERIFICATION_PASSED" != "true" ]]; then
            echo "passed=false" >>"$GITHUB_OUTPUT"
            echo "failure_artifact=$LOCAL_FAILURE_ARTIFACT" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          {
            ${CODEX_RUNTIME_PATH}/.github/scripts/codex-wait-pr-status.sh
            status=$?
            if [[ "$status" -eq 0 ]]; then
              ${CODEX_RUNTIME_PATH}/.github/scripts/codex-check-sonar-quality-gate.sh
              status=$?
            fi
            exit "$status"
          } >"$RUNNER_TEMP/codex-repaired-pr-status.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/codex-repaired-pr-status.log"
          echo "failure_artifact=$STATUS_FAILURE_ARTIFACT" >>"$GITHUB_OUTPUT"
          if [[ "$status" -eq 0 ]]; then
            echo "passed=true" >>"$GITHUB_OUTPUT"
          else
            mkdir -p "$RUNNER_TEMP/codex-repaired-pr-status-failure"
            cp "$RUNNER_TEMP/codex-repaired-pr-status.log" "$RUNNER_TEMP/codex-repaired-pr-status-failure/verification-failure.log"
            tail -n 240 "$RUNNER_TEMP/codex-repaired-pr-status.log" >"$RUNNER_TEMP/codex-repaired-pr-status-failure/verification-failure-summary.log"
            echo "passed=false" >>"$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload repaired external status failure
        if: >-
          steps.verify.outputs.passed != 'true' &&
          needs.verify-published-pr-1-patch.outputs.passed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.STATUS_FAILURE_ARTIFACT }}
          path: ${{ runner.temp }}/codex-repaired-pr-status-failure
          if-no-files-found: error
          retention-days: 1

  codex-published-pr-verification-failed:
    needs:
      - publish-pr
      - verify-published-pr
      - repair-published-pr-1
      - verify-published-pr-repair-1
      - publish-published-pr-repair-1
      - verify-published-pr-1
    if: |
      always() &&
      needs.publish-pr.outputs.pr_number != '' &&
      needs.verify-published-pr.outputs.passed != 'true' &&
      needs.verify-published-pr-1.outputs.passed != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      ISSUE_KEY: ${{ inputs.issueKey }}
      ISSUE_URL: ${{ inputs.issueUrl }}
      PR_NUMBER: ${{ needs.publish-published-pr-repair-1.outputs.pr_number || needs.publish-pr.outputs.pr_number }}
      EXPECTED_HEAD_SHA: ${{ needs.publish-published-pr-repair-1.outputs.commit_sha || needs.publish-pr.outputs.commit_sha }}
      FAILURE_ARTIFACT: ${{ needs.verify-published-pr-1.outputs.failure_artifact || needs.verify-published-pr.outputs.failure_artifact }}
      FAILURE_MESSAGE: Required Jenkins, Sonar, or credential-free verification failed after the available automated repair attempt.
      CODEX_JIRA_PR_NOTIFY_URL: ${{ secrets.CODEX_JIRA_PR_NOTIFY_URL }}
      CODEX_JIRA_PR_NOTIFY_TIMEOUT_SECONDS: ${{ inputs.jira_notify_timeout_seconds }}
    steps:
      - name: Locate trusted Codex runtime
        uses: hmcts/codex-agent-workflows/.github/actions/runtime@8066b0980d0f098ff82e4964334e77c4dd6685a5

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ inputs.github_app_client_id }}
          private-key: ${{ secrets.CODEX_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Verify GitHub App publisher
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GITHUB_APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: python3 -I ${CODEX_RUNTIME_PATH}/.github/scripts/codex-verify-publisher.py

      - name: Download final verification failure
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.FAILURE_ARTIFACT }}
          path: ${{ runner.temp }}/codex-terminal-failure

      - name: Return failed pull request to draft
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FAILURE_DIR: ${{ runner.temp }}/codex-terminal-failure
          NOTIFY_JIRA: "true"
        run: ${CODEX_RUNTIME_PATH}/.github/scripts/codex-mark-pr-failed.sh

      - name: Fail after published PR repair attempt
        run: |
          echo "Published PR verification failed after the post-PR repair attempt; the PR was returned to draft."
          exit 1

  codex-verification-failed:
    needs:
      - codex-generate
      - verify-codex-output
      - verify-codex-output-1
      - verify-codex-output-2
      - verify-codex-output-3
    if: |
      always() &&
      needs.codex-generate.outputs.has_changes == 'true' &&
      needs.verify-codex-output.outputs.passed != 'true' &&
      needs.verify-codex-output-1.outputs.passed != 'true' &&
      needs.verify-codex-output-2.outputs.passed != 'true' &&
      needs.verify-codex-output-3.outputs.passed != 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Locate trusted Codex runtime
        uses: hmcts/codex-agent-workflows/.github/actions/runtime@8066b0980d0f098ff82e4964334e77c4dd6685a5

      - name: Fail after repair attempts
        run: |
          echo "Codex verification failed after 3 repair attempt(s)."
          exit 1

  codex-prepublication-terminal-failed:
    needs:
      - codex-generate
      - prepare-draft-publication
      - publish-draft-pr
      - publish-pr
    if: |
      always() &&
      needs.codex-generate.outputs.has_changes == 'true' &&
      needs.publish-draft-pr.outputs.pr_number == '' &&
      needs.publish-pr.outputs.pr_number == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      ISSUE_KEY: ${{ inputs.issueKey }}
      ISSUE_URL: ${{ inputs.issueUrl }}
      CODEX_JIRA_PR_NOTIFY_URL: ${{ secrets.CODEX_JIRA_PR_NOTIFY_URL }}
      CODEX_JIRA_PR_NOTIFY_TIMEOUT_SECONDS: ${{ inputs.jira_notify_timeout_seconds }}

    steps:
      - name: Locate trusted Codex runtime
        uses: hmcts/codex-agent-workflows/.github/actions/runtime@8066b0980d0f098ff82e4964334e77c4dd6685a5

      - name: Notify Jira that no patch could be published
        continue-on-error: true
        env:
          RECOVERY_AVAILABLE: ${{ needs.prepare-draft-publication.outputs.available }}
        run: |
          python3 -I ${CODEX_RUNTIME_PATH}/.github/scripts/notify-jira-automation.py \
            --status failed \
            --message "Credential-free verification or publication infrastructure failed before a pull request could be published. Structurally valid draft available: ${RECOVERY_AVAILABLE}. See the workflow run for details."

      - name: Stop workflow after terminal pre-publication failure
        run: |
          echo "::error title=Codex publication failed::No verified or draft pull request was published; a terminal Jira callback was attempted."
          exit 1
