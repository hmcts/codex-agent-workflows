name: Codex initial verification

on:
  workflow_call:
    inputs:
      node_version:
        required: false
        default: "22"
        type: string
      has_changes:
        required: true
        type: string
      branch_name:
        required: true
        type: string
      source_artifact:
        required: true
        type: string
    outputs:
      passed:
        value: ${{ jobs.verify-codex-output.outputs.passed }}
      output_artifact:
        value: ${{ jobs.verify-codex-output.outputs.output_artifact }}
      verified_artifact:
        value: ${{ jobs.verify-codex-output.outputs.verified_artifact }}
      draft_artifact:
        value: ${{ jobs.verify-codex-output.outputs.draft_artifact }}
      failure_artifact:
        value: ${{ jobs.verify-codex-output.outputs.failure_artifact }}
      failure_class:
        value: ${{ jobs.verify-codex-output.outputs.failure_class }}

jobs:
  verify-codex-output:
    if: inputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {}
    outputs:
      passed: ${{ steps.verify.outputs.passed || 'false' }}
      output_artifact: codex-jira-output
      verified_artifact: codex-jira-verified-0
      draft_artifact: codex-jira-unverified-0
      failure_artifact: codex-jira-verification-failure-0
      failure_class: ${{ steps.verify.outputs.failure_class || 'implementation' }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EXPECTED_BRANCH_NAME: ${{ inputs.branch_name }}
      LOCAL_PIPELINE_MODE: fast
      CODEX_OUTPUT_ARTIFACT: codex-jira-output
      CODEX_VERIFIED_ARTIFACT: codex-jira-verified-0
      CODEX_DRAFT_ARTIFACT: codex-jira-unverified-0
      CODEX_FAILURE_ARTIFACT: codex-jira-verification-failure-0

    steps:
      - name: Locate trusted Codex runtime
        uses: hmcts/codex-agent-workflows/.github/actions/runtime@251cd5e577c0cb9acb22b953264ab5514a350402

      - name: Download credential-free verification source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.source_artifact }}
          path: ${{ runner.temp }}/codex-verification-source

      - name: Restore credential-free verification source
        run: tar -xzf "$RUNNER_TEMP/codex-verification-source/codex-verification-source.tar.gz" -C "$GITHUB_WORKSPACE"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Download Codex output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.CODEX_OUTPUT_ARTIFACT }}
          path: ${{ runner.temp }}/codex-output

      - name: Verify Codex patch
        id: verify
        env:
          OUTPUT_DIR: ${{ runner.temp }}/codex-output
        run: |
          is_transient_browser_failure() {
            local log="$1"
            grep -Fq "Failed to launch the browser process" "$log" &&
              grep -Fq "/sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq" "$log" &&
              grep -Fq "/sys/devices/system/cpu/cpu0/cpufreq/scaling_max_freq" "$log"
          }

          cp -a "$OUTPUT_DIR" "$RUNNER_TEMP/codex-output-before-verification"
          set +e
          ${CODEX_RUNTIME_PATH}/.github/scripts/codex-jira-verify.sh >"$RUNNER_TEMP/codex-verification-attempt-1.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/codex-verification-attempt-1.log"

          failure_class=implementation
          if [[ "${status}" -ne 0 ]] && is_transient_browser_failure "$RUNNER_TEMP/codex-verification-attempt-1.log"; then
            echo "::warning::Retrying verification once after a recognised transient Chrome/Puppeteer launch failure."
            cd "$RUNNER_TEMP"
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            tar -xzf "$RUNNER_TEMP/codex-verification-source/codex-verification-source.tar.gz" -C "$GITHUB_WORKSPACE"
            rm -rf "$RUNNER_TEMP/codex-jira-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$OUTPUT_DIR"
            cp -a "$RUNNER_TEMP/codex-output-before-verification" "$OUTPUT_DIR"
            cd "$GITHUB_WORKSPACE"
            set +e
            ${CODEX_RUNTIME_PATH}/.github/scripts/codex-jira-verify.sh >"$RUNNER_TEMP/codex-verification-attempt-2.log" 2>&1
            status=$?
            set -e
            cat "$RUNNER_TEMP/codex-verification-attempt-2.log"
            if [[ "${status}" -ne 0 ]] && is_transient_browser_failure "$RUNNER_TEMP/codex-verification-attempt-2.log"; then
              failure_class=environment
            fi
          fi

          final_log="$RUNNER_TEMP/codex-verification-attempt-1.log"
          if [[ -f "$RUNNER_TEMP/codex-verification-attempt-2.log" ]]; then
            final_log="$RUNNER_TEMP/codex-verification-attempt-2.log"
          fi
          if [[ "${status}" -eq 0 ]]; then
            echo "passed=true" >>"$GITHUB_OUTPUT"
            echo "failure_class=none" >>"$GITHUB_OUTPUT"
          else
            mkdir -p "$RUNNER_TEMP/codex-verification-failure"
            cp "$RUNNER_TEMP"/codex-verification-attempt-*.log "$RUNNER_TEMP/codex-verification-failure/"
            cp "$final_log" "$RUNNER_TEMP/codex-verification-failure/verification-failure.log"
            tail -n 240 "$final_log" >"$RUNNER_TEMP/codex-verification-failure/verification-failure-summary.log"
            echo "passed=false" >>"$GITHUB_OUTPUT"
            echo "failure_class=${failure_class}" >>"$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload verified Codex output
        if: steps.verify.outputs.passed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.CODEX_VERIFIED_ARTIFACT }}
          path: |
            ${{ runner.temp }}/codex-output/codex-pr-body.md
            ${{ runner.temp }}/codex-output/guardrail-changes.txt
            ${{ runner.temp }}/codex-output/verification.env
          if-no-files-found: error
          retention-days: 1

      - name: Upload unverified Codex output for draft publication
        if: steps.verify.outputs.passed != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.CODEX_DRAFT_ARTIFACT }}
          path: |
            ${{ runner.temp }}/codex-output/codex-pr-body.md
            ${{ runner.temp }}/codex-output/guardrail-changes.txt
            ${{ runner.temp }}/codex-output/verification.env
          if-no-files-found: error
          retention-days: 1

      - name: Upload verification failure
        if: steps.verify.outputs.passed != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.CODEX_FAILURE_ARTIFACT }}
          path: ${{ runner.temp }}/codex-verification-failure
          if-no-files-found: error
          retention-days: 1
