name: Codex published PR verification

on:
  workflow_call:
    inputs:
      node_version:
        required: false
        default: "22"
        type: string
      java_version:
        required: false
        default: "21"
        type: string
      sonar_host_url:
        required: true
        type: string
      sonar_project_key:
        required: true
        type: string
      required_status_context:
        required: true
        type: string
      required_status_poll_seconds:
        required: true
        type: string
      required_status_timeout_seconds:
        required: true
        type: string
      branch_name:
        required: true
        type: string
      trusted_sha:
        required: true
        type: string
      source_artifact:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
      output_artifact:
        required: true
        type: string
    outputs:
      passed:
        value: ${{ jobs.verify-published-pr.outputs.passed }}
      output_artifact:
        value: ${{ jobs.verify-published-pr.outputs.output_artifact }}
      failure_artifact:
        value: ${{ jobs.verify-published-pr.outputs.failure_artifact }}
      failure_class:
        value: ${{ jobs.verify-published-pr.outputs.failure_class }}
    secrets:
      CODEX_SONAR_TOKEN:
        required: false

jobs:
  verify-published-pr-patch:
    if: inputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {}
    outputs:
      passed: ${{ steps.verify.outputs.passed || 'false' }}
      output_artifact: ${{ steps.selected-artifacts.outputs.output_artifact }}
      failure_artifact: ${{ steps.selected-artifacts.outputs.failure_artifact }}
      failure_class: ${{ steps.verify.outputs.failure_class || 'implementation' }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EXPECTED_BRANCH_NAME: ${{ inputs.branch_name }}
      LOCAL_PIPELINE_MODE: fast
      CODEX_OUTPUT_ARTIFACT: ${{ inputs.output_artifact }}
      CODEX_FAILURE_ARTIFACT: codex-jira-pr-verification-failure-0

    steps:
      - name: Locate trusted Codex runtime
        uses: hmcts/codex-agent-workflows/.github/actions/runtime@251cd5e577c0cb9acb22b953264ab5514a350402

      - name: Record selected Codex artifacts
        id: selected-artifacts
        run: |
          echo "output_artifact=${CODEX_OUTPUT_ARTIFACT}" >>"$GITHUB_OUTPUT"
          echo "failure_artifact=${CODEX_FAILURE_ARTIFACT}" >>"$GITHUB_OUTPUT"

      - name: Download credential-free verification source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.source_artifact }}
          path: ${{ runner.temp }}/codex-verification-source

      - name: Restore credential-free verification source
        run: tar -xzf "$RUNNER_TEMP/codex-verification-source/codex-verification-source.tar.gz" -C "$GITHUB_WORKSPACE"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Download Codex output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.CODEX_OUTPUT_ARTIFACT }}
          path: ${{ runner.temp }}/codex-output

      - name: Verify published PR patch without credentials
        id: verify
        env:
          OUTPUT_DIR: ${{ runner.temp }}/codex-output
        run: |
          set +e
          ${CODEX_RUNTIME_PATH}/.github/scripts/codex-jira-verify.sh >"$RUNNER_TEMP/codex-pr-verification.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/codex-pr-verification.log"
          if [[ "$status" -eq 0 ]]; then
            echo "passed=true" >>"$GITHUB_OUTPUT"
            echo "failure_class=none" >>"$GITHUB_OUTPUT"
          else
            mkdir -p "$RUNNER_TEMP/codex-pr-verification-failure"
            cp "$RUNNER_TEMP/codex-pr-verification.log" "$RUNNER_TEMP/codex-pr-verification-failure/verification-failure.log"
            tail -n 240 "$RUNNER_TEMP/codex-pr-verification.log" >"$RUNNER_TEMP/codex-pr-verification-failure/verification-failure-summary.log"
            echo "passed=false" >>"$GITHUB_OUTPUT"
            if [[ "$status" -eq 124 || "$status" -eq 137 ]]; then
              echo "failure_class=environment" >>"$GITHUB_OUTPUT"
            else
              echo "failure_class=implementation" >>"$GITHUB_OUTPUT"
            fi
          fi
          exit 0

      - name: Upload PR verification failure
        if: steps.verify.outputs.passed != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.CODEX_FAILURE_ARTIFACT }}
          path: ${{ runner.temp }}/codex-pr-verification-failure
          if-no-files-found: error
          retention-days: 1

  verify-published-pr:
    needs: verify-published-pr-patch
    if: inputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      passed: ${{ steps.verify.outputs.passed || 'false' }}
      output_artifact: ${{ needs.verify-published-pr-patch.outputs.output_artifact }}
      failure_artifact: ${{ steps.verify.outputs.failure_artifact }}
      failure_class: ${{ steps.verify.outputs.failure_class || 'implementation' }}
    env:
      GH_TOKEN: ${{ github.token }}
      SONAR_TOKEN: ${{ secrets.CODEX_SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
      SONAR_PROJECT_KEY: ${{ inputs.sonar_project_key }}
      PR_NUMBER: ${{ inputs.pr_number }}
      PUBLISHED_COMMIT_SHA: ${{ inputs.commit_sha }}
      REQUIRED_STATUS_CONTEXT: ${{ inputs.required_status_context }}
      REQUIRED_STATUS_TIMEOUT_SECONDS: ${{ inputs.required_status_timeout_seconds }}
      REQUIRED_STATUS_POLL_SECONDS: ${{ inputs.required_status_poll_seconds }}
      STATUS_FAILURE_ARTIFACT: codex-jira-pr-status-failure-0
    steps:
      - name: Locate trusted Codex runtime
        uses: hmcts/codex-agent-workflows/.github/actions/runtime@251cd5e577c0cb9acb22b953264ab5514a350402

      - name: Checkout trusted status scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.trusted_sha }}
          persist-credentials: false
      - name: Check external PR status and Sonar quality gate
        id: verify
        env:
          LOCAL_VERIFICATION_PASSED: ${{ needs.verify-published-pr-patch.outputs.passed }}
          LOCAL_FAILURE_ARTIFACT: ${{ needs.verify-published-pr-patch.outputs.failure_artifact }}
        run: |
          if [[ "$LOCAL_VERIFICATION_PASSED" != "true" ]]; then
            echo "passed=false" >>"$GITHUB_OUTPUT"
            echo "failure_artifact=$LOCAL_FAILURE_ARTIFACT" >>"$GITHUB_OUTPUT"
            echo "failure_class=${{ needs.verify-published-pr-patch.outputs.failure_class }}" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          failure_class=implementation
          {
            ${CODEX_RUNTIME_PATH}/.github/scripts/codex-wait-pr-status.sh
            status=$?
            if [[ "$status" -eq 2 ]]; then
              failure_class=no-build
            elif [[ "$status" -eq 0 ]]; then
              ${CODEX_RUNTIME_PATH}/.github/scripts/codex-check-sonar-quality-gate.sh
              status=$?
            fi
          } >"$RUNNER_TEMP/codex-pr-status.log" 2>&1
          cat "$RUNNER_TEMP/codex-pr-status.log"
          echo "failure_artifact=$STATUS_FAILURE_ARTIFACT" >>"$GITHUB_OUTPUT"
          if [[ "$status" -eq 0 ]]; then
            echo "passed=true" >>"$GITHUB_OUTPUT"
            echo "failure_class=none" >>"$GITHUB_OUTPUT"
          else
            mkdir -p "$RUNNER_TEMP/codex-pr-status-failure"
            cp "$RUNNER_TEMP/codex-pr-status.log" "$RUNNER_TEMP/codex-pr-status-failure/verification-failure.log"
            tail -n 240 "$RUNNER_TEMP/codex-pr-status.log" >"$RUNNER_TEMP/codex-pr-status-failure/verification-failure-summary.log"
            echo "passed=false" >>"$GITHUB_OUTPUT"
            echo "failure_class=${failure_class}" >>"$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Upload external status failure
        if: >-
          steps.verify.outputs.passed != 'true' &&
          needs.verify-published-pr-patch.outputs.passed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.STATUS_FAILURE_ARTIFACT }}
          path: ${{ runner.temp }}/codex-pr-status-failure
          if-no-files-found: error
          retention-days: 1
